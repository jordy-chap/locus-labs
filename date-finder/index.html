<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Date Finder</title>
<meta name="description" content="Tap the days you're free in December and January to find the best dates for the group.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: narrow single column; name box, two month grids to tap, then ranked best dates. */
:root{
  --bg:#f5f6f4; --fg:#1b2420; --muted:#66726b; --card:#ffffff; --line:#dde2de;
  --accent:#1f6f54; --accent-fg:#ffffff; --mine:#e8a33d;
  --heat0:#eef1ee; --heat1:#c9e4d6; --heat2:#8cc6a8; --heat3:#4fa27c; --heat4:#1f6f54;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif; --font-b:'DM Sans',system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --fg:#e6ece8; --muted:#8e9c94; --card:#1a221e; --line:#2b3630;
  --accent:#58c49a; --accent-fg:#0d1511; --mine:#f0b755;
  --heat0:#222c27; --heat1:#2d4a3c; --heat2:#3d7459; --heat3:#4fa27c; --heat4:#74d4aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --fg:#e6ece8; --muted:#8e9c94; --card:#1a221e; --line:#2b3630;
  --accent:#58c49a; --accent-fg:#0d1511; --mine:#f0b755;
  --heat0:#222c27; --heat1:#2d4a3c; --heat2:#3d7459; --heat3:#4fa27c; --heat4:#74d4aa; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;
  padding-inline:16px;padding-block:24px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--font-d);font-weight:800;font-size:2rem;margin:0;text-wrap:balance}
h2{font-family:var(--font-d);font-weight:600;font-size:1.15rem;margin:0}
p{margin:0;color:var(--muted);line-height:1.45}
section{display:flex;flex-direction:column;gap:12px}
.who{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;min-width:0;flex:1 1 180px}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);font-weight:500;border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.day{aspect-ratio:1;border-radius:6px;border:2px solid transparent;background:var(--heat0);color:var(--fg);
  padding:0;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;font-variant-numeric:tabular-nums}
.day small{font-size:.6rem;opacity:.8}
.day[data-h="1"]{background:var(--heat1)}.day[data-h="2"]{background:var(--heat2)}
.day[data-h="3"]{background:var(--heat3);color:#fff}.day[data-h="4"]{background:var(--heat4);color:var(--accent-fg)}
.day.mine{border-color:var(--mine)}
.day:disabled{visibility:hidden}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--mine);vertical-align:-2px;margin-right:4px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
li b{font-variant-numeric:tabular-nums;color:var(--accent)}
li span.names{color:var(--muted);font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:500;padding:6px 12px;border-radius:99px}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em}
</style>
</head>
<body>
<main>
  <header>
    <h1>Date Finder</h1>
    <p>Tap every day you could do in December and January. Your pick saves as you go, and the best dates for the group show at the bottom.</p>
  </header>

  <section>
    <h2>Who are you?</h2>
    <div class="who">
      <input id="name" placeholder="Your name" autocomplete="given-name" maxlength="30">
      <button id="clear" class="ghost" type="button">Clear my days</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="status" id="status" role="status"></div>
  </section>

  <section id="months"></section>
  <div class="legend">
    <span><span class="sw"></span>your days</span>
    <span>Darker green means more people are free. Number is head count.</span>
  </div>

  <section>
    <h2>Best dates</h2>
    <ol id="best"><li><span class="names">Nobody has picked yet.</span></li></ol>
    <p id="people"></p>
  </section>
</main>

<script>
const MONTHS=[{y:2026,m:11},{y:2027,m:0}];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const API='/api/avail',POLL_MS=15000;
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const nameEl=document.getElementById('name'),statusEl=document.getElementById('status');
let ready=false,all={},mine=new Set(),saveT=null,saving=0,saveChain=Promise.resolve();
try{nameEl.value=localStorage.getItem('df-name')||''}catch(e){}
const slug=n=>n.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const status=t=>statusEl.textContent=t;

function loadMine(){
  const s=slug(nameEl.value);
  mine=new Set(s&&all[s]?all[s].days:[]);
}
function render(){
  const ppl=Object.values(all).filter(p=>p.days&&p.days.length);
  const counts={},who={};
  ppl.forEach(p=>p.days.forEach(d=>{counts[d]=(counts[d]||0)+1;(who[d]=who[d]||[]).push(p.name)}));
  const max=Math.max(1,ppl.length);
  const box=document.getElementById('months');box.innerHTML='';
  MONTHS.forEach(({y,m})=>{
    const wrap=document.createElement('div');wrap.className='month';
    wrap.innerHTML=`<h2>${MN[m]} ${y}</h2>`;
    const g=document.createElement('div');g.className='grid';
    ['M','T','W','T','F','S','S'].forEach(d=>{const e=document.createElement('div');e.className='dow';e.textContent=d;g.append(e)});
    const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
    for(let i=0;i<first;i++){const b=document.createElement('button');b.className='day';b.disabled=true;g.append(b)}
    for(let d=1;d<=n;d++){
      const k=key(y,m,d),c=counts[k]||0,b=document.createElement('button');
      b.type='button';b.className='day'+(mine.has(k)?' mine':'');
      b.dataset.h=c?Math.max(1,Math.ceil(c/max*4)):0;
      b.innerHTML=`${d}${c?`<small>${c}</small>`:''}`;
      b.setAttribute('aria-pressed',mine.has(k));
      b.title=(who[k]||[]).join(', ');
      b.onclick=()=>toggle(k);
      g.append(b);
    }
    wrap.append(g);box.append(wrap);
  });
  const best=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b)).slice(0,8);
  const ol=document.getElementById('best');ol.innerHTML='';
  if(!best.length){ol.innerHTML='<li><span class="names">Nobody has picked yet.</span></li>'}
  best.forEach(k=>{
    const [y,m,d]=k.split('-').map(Number);
    const dt=new Date(y,m-1,d).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
    const li=document.createElement('li');
    const missing=ppl.filter(p=>!p.days.includes(k)).map(p=>p.name);
    li.innerHTML=`<div><b></b> <span></span></div><span class="names"></span>`;
    li.querySelector('b').textContent=`${counts[k]}/${ppl.length}`;
    li.querySelector('div span').textContent=dt;
    li.querySelector('.names').textContent=missing.length?`Can't: ${missing.join(', ')}`:'Everyone is free';
    ol.append(li);
  });
  const ch=document.getElementById('chips');ch.innerHTML='';
  Object.values(all).forEach(p=>{const b=document.createElement('button');b.type='button';b.textContent=p.name;
    b.onclick=()=>{nameEl.value=p.name;nameEl.dispatchEvent(new Event('input'))};ch.append(b)});
  document.getElementById('people').textContent=ppl.length?`Responded: ${ppl.map(p=>p.name).join(', ')}`:'';
}
function toggle(k){
  const nm=nameEl.value.trim();
  if(!nm){status('Enter your name first.');nameEl.focus();return}
  if(!ready){status('Still loading, try again in a second.');return}
  mine.has(k)?mine.delete(k):mine.add(k);
  const s=slug(nm);all[s]={name:nm,days:[...mine].sort()};
  render();status('Saving...');
  clearTimeout(saveT);saveT=setTimeout(save,400);
}
// Saves run one after another so a slow request can't land after a newer one.
function save(){
  saveT=null;
  const body=JSON.stringify({name:nameEl.value.trim(),days:[...mine].sort()});
  saving++;
  saveChain=saveChain.then(async()=>{
    try{
      const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error||r.status);
      status('Saved.');
    }catch(e){status('Could not save: '+(e.message||e))}
    finally{saving--}
  });
}
async function refresh(){
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const {people}=await r.json();
    if(saveT||saving)return; // don't let a poll overwrite taps that haven't saved yet
    all=people||{};ready=true;
    loadMine();render();
  }catch(e){status('Connection problem: '+(e.message||e))}
}
nameEl.addEventListener('input',()=>{
  try{localStorage.setItem('df-name',nameEl.value.trim())}catch(e){}
  loadMine();render();status('');
});
document.getElementById('clear').onclick=()=>{
  if(!ready||!nameEl.value.trim())return;
  clearTimeout(saveT);
  mine.clear();all[slug(nameEl.value)]={name:nameEl.value.trim(),days:[]};render();save();
};
render();
refresh();
setInterval(()=>{if(!document.hidden)refresh()},POLL_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script>
</body>
</html>
